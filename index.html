<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportCash - Kasir Olahraga</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>SportCash</h1>
        <p>Kasir Digital Perlengkapan Olahraga</p>
    </header>

    <nav>
        <button onclick="showPage('dashboard')">Dashboard</button>
        <button onclick="showPage('stok')">Data Stok</button>
        <button onclick="showPage('kasir')">Kasir</button>
        <button onclick="showPage('kas')">Kas Masuk & Keluar</button>
    </nav>

    <main>

        <!-- DASHBOARD -->
        <section id="dashboard" class="page active">

            <h2>Dashboard</h2>

            <div class="cards">

                <div class="card">
                    <p>Kas Masuk</p>
                    <h3 id="totalMasuk">Rp 0</h3>
                </div>

                <div class="card">
                    <p>Kas Keluar</p>
                    <h3 id="totalKeluar">Rp 0</h3>
                </div>

                <div class="card">
                    <p>Laba Bulan Ini</p>
                    <h3 id="laba">Rp 0</h3>
                </div>

                <div class="card">
                    <p>Jenis Barang</p>
                    <h3 id="jumlahBarang">0</h3>
                </div>

            </div>

            <div class="box">

                <h3>Arus Kas Harian</h3>

                <div id="arusKas"></div>

            </div>

        </section>


        <!-- DATA STOK -->
        <section id="stok" class="page">

            <h2>Data Stok</h2>

            <div class="box form-box">

                <input
                    type="text"
                    id="namaBarang"
                    placeholder="Nama barang"
                >

                <input
                    type="text"
                    id="jenisBarang"
                    placeholder="Jenis barang"
                >

                <input
                    type="number"
                    id="hargaBarang"
                    placeholder="Harga"
                >

                <input
                    type="number"
                    id="stokBarang"
                    placeholder="Jumlah stok"
                >

                <button onclick="tambahBarang()">
                    Tambah Barang
                </button>

            </div>


            <div class="box table-box">

                <table>

                    <thead>
                        <tr>
                            <th>Barang</th>
                            <th>Jenis</th>
                            <th>Harga</th>
                            <th>Stok</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>

                    <tbody id="tabelStok"></tbody>

                </table>

            </div>

        </section>


        <!-- KASIR -->
        <section id="kasir" class="page">

            <h2>Kasir</h2>

            <div class="box">

                <select
                    id="pilihBarang"
                    onchange="tampilkanHarga()">
                </select>

                <input
                    type="number"
                    id="jumlahBeli"
                    placeholder="Jumlah beli"
                    min="1"
                >

                <p>
                    Harga:
                    <strong id="hargaKasir">
                        Rp 0
                    </strong>
                </p>

                <p>
                    Total:
                    <strong id="totalKasir">
                        Rp 0
                    </strong> 

                <button onclick="hitungTotal()">
                    Hitung Total
                </button>

                <button onclick="simpanPenjualan()">
                    Simpan Penjualan
                </button>

            </div>

        </section>


        <!-- KAS MASUK & KELUAR -->
        <section id="kas" class="page">

            <h2>Kas Masuk & Keluar</h2>

            <div class="box form-box">

                <input
                    type="date"
                    id="tanggalKas"
                >

                <select id="jenisKas">

                    <option value="masuk">
                        Kas Masuk
                    </option>

                    <option value="keluar">
                        Kas Keluar
                    </option>

                </select>

                <input
                    type="number"
                    id="jumlahKas"
                    placeholder="Jumlah"
                >

                <input
                    type="text"
                    id="keteranganKas"
                    placeholder="Keterangan"
                >

                <button onclick="tambahKas()">
                    Simpan Kas
                </button>

            </div>


            <div class="box table-box">

                <table>

                    <thead>

                        <tr>
                            <th>Tanggal</th>
                            <th>Jenis</th>
                            <th>Jumlah</th>
                            <th>Keterangan</th>
                            <th>Aksi</th>
                        </tr>

                    </thead>

                    <tbody id="tabelKas"></tbody>

                </table>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
